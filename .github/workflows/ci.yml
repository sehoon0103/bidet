name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc
      - name: Compile
        run: avr-gcc -mmcu=atmega328p -Os -Wall -c bidet.c -o bidet.o
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: MISRA-style static analysis
        run: cppcheck --addon=misra --enable=all --error-exitcode=1 bidet.c
